# S12_hypersonic with the VBM tracker (variational, merged reports) in place of association-by-label.
# Same seeds give the same world, objects and sensor reports as S12; only tracking differs.
#
#   python -m cidgen.generate --scenario S12_vbm --seed 1 --seeds 20 --out runs_vbm
name: S12_vbm
base: S12
overrides:
  tracking:
    method: vbm
