# S12F_fast_nonhostile with the GNN multi-target tracker in place of association-by-label.
# Same seeds give the same world, objects and sensor reports as S12F; only tracking differs.
#
#   python -m cidgen.generate --scenario S12F_gnn --seed 1 --seeds 20 --out runs_gnn
name: S12F_gnn
base: S12F
overrides:
  tracking:
    method: gnn
    # gnn:   {gate_chi2: 16.0, confirm_hits: 3, confirm_window_s: 10.0, tier3_min_alt_m: 15000.0}
    # match: {match_gate_m: 2000.0, match_gate_sigmas: 4.0, iff_gate_chi2: 9.21}   # scoring / IFF gate
