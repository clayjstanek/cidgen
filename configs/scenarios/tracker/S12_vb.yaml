# S12_hypersonic with the VB tracker in place of association-by-label.
# Same seeds give the same world, objects and sensor reports as S12; only tracking differs.
#
#   python -m cidgen.generate --scenario S12_vb --seed 1 --seeds 20 --out runs_vb
name: S12_vb
base: S12
overrides:
  tracking:
    method: vb
