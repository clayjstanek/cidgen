# S12 -- Hypersonic (Tier 3) profile tracks added to the S0 baseline.
# Profiles are played back by cidgen/hypersonic_profiles.py; see HYPERSONIC_PROFILES.md.
#
# PLUMBING-TEST is an artificial straight-line fast target (class H, Tier 3) with round numbers,
# used only to drive Tier 3 tracks through the sensors, tracker, BN and TP.
#
#   python -m cidgen.generate --scenario S12 --seed 1 --out runs
name: S12_hypersonic
base: S0
overrides:
  run:
    tiers_enabled: [1, 2, 3]
  tracking:
    tier_source: truth        # or: observed
    tiers:
      1: {q: 3.0,    vel_sigma_mps: [15, 15, 5],    coast_s: 6.0}
      2: {q: 30.0,   vel_sigma_mps: [100, 100, 30], coast_s: 12.0}
      3: {q: 1000.0, vel_sigma_mps: 2000.0,         coast_s: 6.0}
  hypersonic:
    profiles:
      HGV-GENERIC:
        class: G
        segments:
          - phase: glide
            duration_s: 200
            alt_km: [{dist: uniform, low: 55, high: 70}, {dist: uniform, low: 20, high: 50}]
            speed_mps: [{dist: uniform, low: 1500, high: 4000}, null]
            weave_g: {dist: uniform, low: 0.5, high: 2.0}
            weave_period_s: 10
          - {phase: terminal, duration_s: 80, alt_km: [null, 0.0],
            speed_mps: [null, {dist: uniform, low: 1000, high: 1200}]}

      J:                                   # same as HGV-GENERIC, no weave
        class: G
        segments:
          - phase: glide
            duration_s: 200
            alt_km: [{dist: uniform, low: 55, high: 70}, {dist: uniform, low: 20, high: 50}]
            speed_mps: [{dist: uniform, low: 1500, high: 4000}, null]
          - {phase: terminal, duration_s: 80, alt_km: [null, 0.0],
            speed_mps: [null, {dist: uniform, low: 1000, high: 1200}]}

      HCM-GENERIC:
        class: X                           # generic Tier 3 placeholder; add your own class to tell HCMs apart
        segments:
          - phase: cruise
            duration_s: 240
            alt_km:
              - {dist: uniform, low: 25.0, high: 28.0}     # cruise entry altitude
              - {dist: uniform, low: 20.0, high: 24.0}     # cruise exit altitude
            speed_mps:
              - {dist: uniform, low: 1910.0, high: 2100.0} # cruise entry speed
              - {dist: uniform, low: 1700.0, high: 1900.0} # cruise exit speed
            weave_g: {dist: uniform, low: 0.5, high: 2.0}
            weave_period_s: 10
          - phase: terminal
            duration_s: 34
            alt_km: [null, 0.0]                            # continues from cruise exit altitude
            speed_mps: [null, {dist: uniform, low: 1000.0, high: 1200.0}]   # continues from cruise exit speed

      ABM-GENERIC:
        class: Y
        segments:
          - phase: midcourse_skip
            duration_s: 180
            alt_km:
              - { dist: uniform, low: 40.0, high: 50.0 }
              - { dist: uniform, low: 30.0, high: 35.0 }
            speed_mps:
              - { dist: uniform, low: 2400.0, high: 2800.0 }
              - { dist: uniform, low: 1800.0, high: 2100.0 }
            weave_g: { dist: uniform, low: 1.0, high: 3.5 }
            weave_period_s: 25
          - phase: terminal
            duration_s: 25
            alt_km: [null, 0.0]                                   # continues from the skip exit
            speed_mps: [null, { dist: uniform, low: 1100.0, high: 1400.0 }]

      MARV-GENERIC:
        class: Z
        segments:
          - phase: re_entry_ballistic
            duration_s: 120
            alt_km:
              - { dist: uniform, low: 100.0, high: 120.0 }
              - { dist: uniform, low: 25.0, high: 30.0 }
            speed_mps:
              - { dist: uniform, low: 3500.0, high: 4200.0 }
              - { dist: uniform, low: 2200.0, high: 2600.0 }
            weave_g: 0.0
          - phase: terminal_evasive
            duration_s: 15
            alt_km: [null, 0.0]                                   # continues from re-entry exit
            speed_mps: [null, { dist: uniform, low: 1200.0, high: 1600.0 }]
            weave_g: { dist: uniform, low: 4.0, high: 9.0 }
            weave_period_s: 4

      PLUMBING-TEST:
        class: H
        allegiance: hostile
        rcs_dbsm: {dist: normal, mean: 0.0, std: 1.0}
        segments:
          - {phase: cruise,   duration_s: 300, alt_km: [15.0, 15.0], speed_mps: [1200, 1200],
             weave_g: {dist: uniform, low: 0.5, high: 2.0}, weave_period_s: 30}
          - {phase: terminal, duration_s: 30,  alt_km: [null, 0.0],  speed_mps: [null, 1000]}

    # Raids are played in order. Raid 2 starts 50-70 s after raid 1's last HGV arrives.
    # Runs are 1800 s. Worst case: raid 1 ends 1000 s, raid 2 ends 1350 s, raid 3 (HCMs) ends 1744 s.
    raid:
      - {profile: HGV-GENERIC,   count: 4, arrival_window_s: [500, 900]}   # raid 1
      - {profile: ABM-GENERIC,  count: 12, arrival_window_s: [550, 1100]}
      - {profile: MARV-GENERIC, count: 8, arrival_window_s: [400, 1000]}
      - {profile: J,             count: 6, start_after_prev_s: [50, 70]}    # raid 2
      - {profile: HCM-GENERIC,   count: 4, start_after_prev_s: [100, 120]}  # raid 3: after raid 2
      - {profile: PLUMBING-TEST, count: 3, arrival_window_s: [600, 1700]}   # test tracks, independent
    arrival_window_s: [600, 1700]
    ingress_halfwidth_deg: 30
    track_coast_s: 6.0
    tracker: {q: 1000.0, vel_sigma_mps: 2000.0}
